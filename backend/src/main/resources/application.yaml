spring:
  application:
    name: finshop-backend

  datasource:
    url:jdbc: postgresql://localhost:5432/finshop
    username: postgres
    password: secret
    diver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
